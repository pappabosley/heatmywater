# Dux HP dashboard for the Shelly Wall Display.
# Built-in cards only (no HACS frontend cards needed).
#
# Settings > Dashboards > Add dashboard > "New dashboard from scratch",
# open it, ⋮ > Edit dashboard > ⋮ > Raw configuration editor, paste this, Save.
# Then point the Wall Display's Home Assistant dashboard at it.
#
# Entity IDs assume the device is called "Dux HP" (the default).

title: Hot water
views:
  - title: Hot water
    path: hot-water
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: gauge
            entity: sensor.dux_hp_tank_temperature
            name: Tank
            min: 20
            max: 70
            needle: true
            severity:
              red: 20
              yellow: 40
              green: 50
            grid_options:
              columns: full

          - type: tile
            entity: sensor.dux_hp_current_mode
            name: Mode now
            icon: mdi:water-boiler
            grid_options:
              columns: 9

          # Reads the heater now (normal polling is every 30 min).
          - type: button
            entity: button.dux_hp_refresh
            name: Refresh
            icon: mdi:refresh
            show_state: false
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.dux_hp_refresh
            grid_options:
              columns: 3

          - type: tile
            entity: switch.dux_hp_boost
            name: Boost
            icon: mdi:rocket-launch
            color: deep-orange
            tap_action:
              action: toggle
            grid_options:
              columns: full
              rows: 2

          - type: tile
            entity: number.dux_hp_boost_target_temperature
            name: Boost target
            features:
              - type: numeric-input
                style: buttons
            grid_options:
              columns: full
              rows: 2

          - type: tile
            entity: select.dux_hp_operating_mode
            name: Operating mode
            features:
              - type: select-options
            grid_options:
              columns: full
              rows: 2

      - type: grid
        cards:
          - type: glance
            show_state: true
            columns: 4
            entities:
              - entity: binary_sensor.dux_hp_compressor
                name: Heat pump
              - entity: binary_sensor.dux_hp_element
                name: Element
              - entity: binary_sensor.dux_hp_fan
                name: Fan
              - entity: binary_sensor.dux_hp_problem
                name: Fault
            grid_options:
              columns: full

          - type: glance
            show_state: true
            columns: 3
            entities:
              - entity: sensor.dux_hp_heat_pump_energy_today
                name: HP today
              - entity: sensor.dux_hp_element_energy_today
                name: Element today
              - entity: sensor.dux_hp_air_temperature
                name: Air
            grid_options:
              columns: full

          - type: history-graph
            title: Last 24 hours
            hours_to_show: 24
            entities:
              - entity: sensor.dux_hp_tank_temperature
                name: Tank
            grid_options:
              columns: full
